</style></head><body><header><div class="logo">

</div></header><div class="container"><h1>

</p><div class="search-box"><input

placeholder="Search videos or channels..."

onkeydown="if(event.key==='Enter') searchVideos()">

<button

</div><h2 id="videoSectionTitle">
Trending Videos
</h2><div id="videos">
Loading videos...
</div></div><script>

let currentUser = null;


/* ===============================
   Check User
=============================== */

async function checkUser(){

    const token =
        localStorage.token;


    if(!token){

        await loadVideos();

        return;

    }


    try{

        const res =
            await fetch(
                "/accounts/me",
                {
                    headers:{
                        "Authorization":
                            "Bearer " +
                            token
                    }
                }
            );


        const data =
            await res.json();


        if(data.success){

            currentUser =
                data.user;


            document.getElementById(
                "status"
            ).innerHTML =
                "Welcome " +
                escapeHtml(
                    data.user.username
                );


            document.getElementById(
                "menu"
            ).innerHTML = `

<button
class="upload"
onclick="location.href='upload.html'">
Upload Video
</button>

<button
class="upload"
onclick="location.href='shorts.html'">
Shorts
</button>

<button
class="upload"
onclick="location.href='edit-channel.html?id=${encodeURIComponent(
    data.user.channel_id
)}'">
Edit Channel
</button>

<button
class="logout"
onclick="logout()">
Logout
</button>

<button
class="delete"
onclick="location.href='delete-account.html'">
Delete Account
</button>

`;

        }


        await loadVideos();


    }catch(error){

        console.log(
            "checkUser error:",
            error
        );


        await loadVideos();

    }

}


/* ===============================
   Logout
=============================== */

function logout(){

    localStorage.removeItem(
        "token"
    );


    currentUser =
        null;


    location.reload();

}


/* ===============================
   Open Channel
=============================== */

function openChannel(id){

    location.href =
        "channel.html?id=" +
        encodeURIComponent(id);

}


/* ===============================
   Load Videos
=============================== */

async function loadVideos(){

    const box =
        document.getElementById(
            "videos"
        );


    const title =
        document.getElementById(
            "videoSectionTitle"
        );


    try{

        const res =
            await fetch(
                "/videos/list"
            );


        const videos =
            await res.json();


        const normalVideos =
            Array.isArray(videos)
            ? videos.filter(
                v =>
                    v.type !== "short"
            )
            : [];


        title.innerHTML =
            "Trending Videos";


        box.innerHTML =
            "";


        if(
            normalVideos.length === 0
        ){

            box.innerHTML =
                "No videos yet";

            return;

        }


        normalVideos.forEach(
            renderVideo
        );


    }catch(error){

        console.log(
            "loadVideos error:",
            error
        );


        box.innerHTML =
            "Error loading videos";

    }

}


/* ===============================
   Render Video
=============================== */

function renderVideo(video){

    const box =
        document.getElementById(
            "videos"
        );


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "video-card";


    const videoId =
        Number(video.id);


    const channelId =
        Number(video.channel_id);


    const likes =
        Array.isArray(video.likes)
        ? video.likes.length
        : 0;


    const dislikes =
        Array.isArray(video.dislikes)
        ? video.dislikes.length
        : 0;


    div.innerHTML = `

<video controls preload="metadata">

<source
src="/videos/watch/${encodeURIComponent(
    video.file
)}">

</video>


<h3>
${escapeHtml(
    video.title || ""
)}
</h3>


<div class="channel-name">

Channel:
${escapeHtml(
    video.channel_name ||
    "Unknown"
)}

</div>


<button
onclick="openChannel(${channelId})">
Visit Channel
</button>


<button
onclick="subscribe(${channelId})">
Subscribe
</button>


<span id="subscribers-${channelId}">
${
    video.subscribers
    ? " Subscribers: " +
      Number(video.subscribers)
    : ""
}
</span>


<p>
${escapeHtml(
    video.description ||
    ""
)}
</p>


<button
class="like"
onclick="likeVideo(${videoId})">

👍

<span id="likes-${videoId}">
${likes}
</span>

</button>


<button
class="dislike"
onclick="dislikeVideo(${videoId})">

👎

<span id="dislikes-${videoId}">
${dislikes}
</span>

</button>


<button
onclick="window.location.href='/comments.html?id=${encodeURIComponent(videoId)}'">
💬 Comments
</button>


<button
onclick="copyVideoLink(${videoId})">
🔗 Copy Link
</button>

`;

    box.appendChild(
        div
    );

}


/* ===============================
   Search Videos
=============================== */

async function searchVideos(){

    const input =
        document.getElementById(
            "searchInput"
        );


    const box =
        document.getElementById(
            "videos"
        );


    const title =
        document.getElementById(
            "videoSectionTitle"
        );


    const query =
        input.value.trim();


    if(!query){

        await loadVideos();

        return;

    }


    title.innerHTML =
        "Search Results";


    box.innerHTML = `

<div class="search-loading">
Searching...
</div>

`;


    try{

        const res =
            await fetch(
                "/videos/search?q=" +
                encodeURIComponent(
                    query
                )
            );


        const data =
            await res.json();


        if(!data.success){

            box.innerHTML =
                "Search failed";

            return;

        }


        const videos =
            Array.isArray(
                data.videos
            )
            ? data.videos.filter(
                v =>
                    v.type !== "short"
            )
            : [];


        box.innerHTML =
            "";


        if(videos.length === 0){

            box.innerHTML = `

<div class="no-results">

No videos found for:

<strong>
${escapeHtml(query)}
</strong>

</div>

`;

            return;

        }


        videos.forEach(
            renderVideo
        );


    }catch(error){

        console.log(
            "search error:",
            error
        );


        box.innerHTML =
            "Error searching videos";

    }

}


/* ===============================
   Like
=============================== */

async function likeVideo(id){

    const token =
        localStorage.token;


    if(!token){

        alert(
            "Login required"
        );

        return;

    }


    try{

        const res =
            await fetch(
                "/videos/like/" +
                id,
                {
                    method:"POST",

                    headers:{
                        "Authorization":
                            "Bearer " +
                            token
                    }
                }
            );


        const data =
            await res.json();


        if(data.success){

            const likes =
                document.getElementById(
                    "likes-" + id
                );


            const dislikes =
                document.getElementById(
                    "dislikes-" + id
                );


            if(likes){

                likes.innerHTML =
                    data.likes;

            }


            if(dislikes){

                dislikes.innerHTML =
                    data.dislikes;

            }


        }else{

            alert(
                data.error ||
                "Failed to like video"
            );

        }


    }catch(error){

        console.error(
            "Like error:",
            error
        );


        alert(
            "Error liking video"
        );

    }

}

/* ===============================
   Subscribe
=============================== */

async function subscribe(id){

    const token =
        localStorage.token;


    if(!token){

        alert(
            "Login required"
        );

        return;

    }


    try{

        const res =
            await fetch(
                "/channels/subscribe/" +
                id,
                {
                    method:"POST",

                    headers:{
                        "Authorization":
                            "Bearer " +
                            token
                    }
                }
            );


        const data =
            await res.json();


        if(data.success){

            const subscribers =
                document.getElementById(
                    "subscribers-" + id
                );


            if(
                subscribers &&
                data.subscribers !== undefined
            ){

                subscribers.innerHTML =
                    " Subscribers: " +
                    Number(
                        data.subscribers
                    );

            }


        }else{

            alert(
                data.error ||
                "Failed to subscribe"
            );

        }


    }catch(error){

        console.error(
            "Subscribe error:",
            error
        );


        alert(
            "Error subscribing"
        );

    }

}


/* ===============================
   Copy Video Link
=============================== */

async function copyVideoLink(id){

    const link =
        window.location.origin +
        "/watch.html?id=" +
        encodeURIComponent(id);

    try{

        await navigator.clipboard.writeText(link);

        alert("Video link copied!");

    }catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value = link;
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();

        try{

            document.execCommand("copy");

            alert("Video link copied!");

        }catch(copyError){

            console.error(
                "Copy failed:",
                copyError
            );

            alert(
                "Could not copy the video link."
            );

        }finally{

            document.body.removeChild(
                textarea
            );

        }

    }

}


/* ===============================
   Escape HTML
=============================== */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ===============================
   Start
=============================== */

checkUser();

</script>
