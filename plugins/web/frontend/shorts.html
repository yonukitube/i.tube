<!DOCTYPE html><html><head><title>i.Tube Shorts</title><style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:black;
color:white;
font-family:Arial;
overflow:hidden;
}


/* =========================
   Search
========================= */

.search-bar{

position:fixed;

top:15px;
left:50%;

transform:translateX(-50%);

width:80%;
max-width:600px;

display:flex;

gap:8px;

z-index:20;

}

.search-bar input{

flex:1;

padding:12px 15px;

border:none;

border-radius:10px;

background:rgba(30,30,30,.9);

color:white;

font-size:16px;

outline:none;

}

.search-bar input:focus{

outline:2px solid red;

}

.search-bar button{

padding:12px 16px;

margin:0;

border:none;

border-radius:10px;

background:red;

color:white;

cursor:pointer;

font-size:16px;

}

.search-bar button:hover{

background:#d00000;

}


/* =========================
   Shorts Container
========================= */

#shorts{

height:100vh;

overflow-y:scroll;

scroll-snap-type:y mandatory;

}


/* =========================
   Short
========================= */

.short{

height:100vh;

width:100%;

display:flex;

justify-content:center;

align-items:center;

scroll-snap-align:start;

position:relative;

}


/* =========================
   Video Box
========================= */

.video-box{

width:95%;

height:90%;

background:#111;

border-radius:20px;

overflow:hidden;

position:relative;

}

.video-box video{

width:100%;

height:100%;

object-fit:cover;

cursor:pointer;

}


/* =========================
   Info
========================= */

.info{

position:absolute;

bottom:25px;

left:20px;

right:100px;

background:rgba(0,0,0,.45);

padding:15px;

border-radius:15px;

z-index:3;

}

.info h3{

margin:0 0 8px 0;

font-size:22px;

}

.info p{

margin:0;

font-size:15px;

opacity:.9;

}


/* =========================
   Actions
========================= */

.actions{

position:absolute;

right:15px;

bottom:130px;

display:flex;

flex-direction:column;

gap:15px;

z-index:3;

}

.action{

display:flex;

flex-direction:column;

align-items:center;

}

.actions button{

width:55px;

height:55px;

border:none;

border-radius:50%;

background:#222;

color:white;

font-size:22px;

cursor:pointer;

}

.actions button:hover{

background:#333;

}

.action span{

margin-top:5px;

font-size:14px;

}


/* =========================
   Progress
========================= */

.progress-container{

position:absolute;

left:15px;

right:15px;

bottom:10px;

height:4px;

background:rgba(255,255,255,.25);

border-radius:10px;

overflow:hidden;

z-index:4;

opacity:0;

transition:.25s;

cursor:pointer;

}

.progress-container.show{

opacity:1;

}

.progress{

width:0%;

height:100%;

background:#ff2d2d;

}


/* =========================
   Pause
========================= */

.pause-indicator{

position:absolute;

top:50%;

left:50%;

transform:translate(-50%,-50%);

font-size:80px;

background:rgba(0,0,0,.35);

width:120px;

height:120px;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

opacity:0;

pointer-events:none;

transition:.2s;

z-index:5;

}

.pause-indicator.show{

opacity:1;

}


/* =========================
   Search Message
========================= */

.search-message{

position:fixed;

top:75px;

left:50%;

transform:translateX(-50%);

background:rgba(20,20,20,.95);

padding:10px 18px;

border-radius:10px;

z-index:19;

display:none;

}

.search-message.show{

display:block;

}


/* =========================
   Back Button
========================= */

.back-button{

position:fixed;

left:15px;

top:15px;

z-index:20;

width:45px;

height:45px;

border:none;

border-radius:50%;

background:rgba(30,30,30,.9);

color:white;

font-size:20px;

cursor:pointer;

}

</style></head><body><button
class="back-button"
onclick="clearSearch()">

←

</button><div class="search-bar"><input
id="searchInput"
type="search"
placeholder="Search Shorts..."
autocomplete="off"
onkeydown="if(event.key==='Enter') searchShorts()"

«»

<button onclick="searchShorts()">
🔍
</button></div><div
id="searchMessage"
class="search-message">
</div><div id="shorts">Loading Shorts...

</div><script>

let currentVideos=[];


/* =========================
   Load Shorts
========================= */

async function loadShorts(){

const box =
document.getElementById("shorts");

try{

const res =
await fetch("/videos/list");

const videos =
await res.json();


currentVideos =
videos.filter(
v => v.type === "short"
);


console.log("SHORTS COUNT:", currentVideos.length); renderShorts(currentVideos);


}catch(e){

console.log(e);

box.innerHTML =
"Error loading Shorts";

}

}


/* =========================
   Render Shorts
========================= */

function renderShorts(videos){

const box =
document.getElementById("shorts");


if(videos.length === 0){

box.innerHTML =
"No Shorts found";

return;

}


box.innerHTML="";


videos.forEach(video=>{

let div =
document.createElement("div");

div.className="short";


div.innerHTML=`

<div class="video-box">

<video
src="/videos/watch/${video.file}"
autoplay
loop
playsinline>
</video>


<div class="pause-indicator">
⏸
</div>


<div class="info">

<h3>
${escapeHTML(video.title)}
</h3>

<p>
${escapeHTML(video.description || "")}
</p>

</div>


<div class="actions">


<div class="action">

<button
onclick="likeVideo(${video.id},this)">
👍
</button>

<span>
${video.likes ? video.likes.length : 0}
</span>

</div>


<div class="action">

<button
onclick="dislikeVideo(${video.id},this)">
👎
</button>

<span>
${video.dislikes ? video.dislikes.length : 0}
</span>

</div>


<div class="action">

<button
onclick="openChannel(${video.channel_id})">
👤
</button>

<span>
Channel
</span>

</div>


<div class="action">

<button
onclick="copyVideoLink(${video.id})">
🔗
</button>

<span>
Share
</span>

</div>



<div class="action">
<button type="button" onclick="openComments(${video.id})">💬</button>
<span>Comments</span>
</div>

<div class="action">

<button
onclick="subscribe(${video.channel_id},this)">
+
</button>

<span>
${video.subscribers || 0}
</span>

</div>


</div>


<div class="progress-container">

<div class="progress"></div>

</div>


</div>

`;


box.appendChild(div);

});


setupVideoControls();

autoPlay();

}


/* =========================
   Search Shorts
========================= */

async function searchShorts(){

const input =
document.getElementById("searchInput");

const query =
input.value.trim();


if(!query){

clearSearch();

return;

}


showSearchMessage("Searching...");


try{


/*
   نستخدم نفس API البحث الموجود
   في الصفحة الرئيسية.
*/

const res =
await fetch(
"/videos/search?q="+
encodeURIComponent(query)
);


const data =
await res.json();


if(!data.success){

showSearchMessage(
"Search failed"
);

return;

}


const results =
(data.videos || [])
.filter(
video => video.type === "short"
);


renderShorts(results);


if(results.length === 0){

showSearchMessage(
"No Shorts found"
);

}else{

showSearchMessage(
results.length+
" Shorts found"
);

}


}catch(error){

console.log(error);

showSearchMessage(
"Error searching Shorts"
);

}

}


/* =========================
   Clear Search
========================= */

function clearSearch(){

const input =
document.getElementById(
"searchInput"
);

input.value="";


hideSearchMessage();


console.log("SHORTS COUNT:", currentVideos.length); renderShorts(currentVideos);

}


/* =========================
   Search Message
========================= */

function showSearchMessage(message){

const element =
document.getElementById(
"searchMessage"
);

element.innerHTML =
escapeHTML(message);

element.classList.add("show");


clearTimeout(
window.searchMessageTimer
);


window.searchMessageTimer =
setTimeout(()=>{

element.classList.remove("show");

},2500);

}


function hideSearchMessage(){

document
.getElementById("searchMessage")
.classList.remove("show");

}


/* =========================
   Video Controls
========================= */

function setupVideoControls(){

document
.querySelectorAll(".video-box")
.forEach(box=>{

const video =
box.querySelector("video");

const progressContainer =
box.querySelector(
".progress-container"
);

const progress =
box.querySelector(".progress");

const pauseIcon =
box.querySelector(
".pause-indicator"
);


let hideTimer;


function showControls(){

progressContainer
.classList.add("show");


clearTimeout(hideTimer);


hideTimer =
setTimeout(()=>{

progressContainer
.classList.remove("show");

},2000);

}


video.addEventListener(
"click",
()=>{

if(video.paused){

video.play();

pauseIcon
.classList.remove("show");

}else{

video.pause();

pauseIcon
.classList.add("show");

}

showControls();

});


video.addEventListener(
"timeupdate",
()=>{

if(video.duration){

const percent =
(video.currentTime /
video.duration) * 100;

progress.style.width =
percent+"%";

}

});


progressContainer.addEventListener(
"click",
e=>{

const rect =
progressContainer
.getBoundingClientRect();


const x =
e.clientX -
rect.left;


let percent =
x / rect.width;


percent =
Math.max(
0,
Math.min(1,percent)
);


if(video.duration){

video.currentTime =
percent *
video.duration;

}

showControls();

});

});

}


/* =========================
   Auto Play
========================= */

function autoPlay(){

let vids =
document.querySelectorAll(
"video"
);


let observer =
new IntersectionObserver(
entries=>{

entries.forEach(e=>{

const pauseIcon =
e.target.parentElement
.querySelector(
".pause-indicator"
);


if(e.isIntersecting){

e.target.play();

pauseIcon
.classList.remove("show");

}else{

e.target.pause();

}

});

},
{
threshold:.7
}
);


vids.forEach(v=>{

v.addEventListener(
"ended",
()=>{

v.play();

});


observer.observe(v);

});

}


/* =========================
   Like
========================= */

async function likeVideo(id,btn){

const token =
localStorage.token;


if(!token){

alert("Login required");

return;

}


const res =
await fetch(
"/videos/like/"+id,
{

method:"POST",

headers:{
Authorization:
"Bearer "+token
}

}
);


const data =
await res.json();


if(data.success){

btn.nextElementSibling
.innerHTML =
data.likes;


const action =
btn.closest(".actions");

const buttons =
action.querySelectorAll(
".action"
);


if(buttons[1]){

buttons[1]
.querySelector("span")
.innerHTML =
data.dislikes;

}

}

}


/* =========================
   Dislike
========================= */

async function dislikeVideo(id,btn){

const token =
localStorage.token;


if(!token){

alert("Login required");

return;

}


const res =
await fetch(
"/videos/dislike/"+id,
{

method:"POST",

headers:{
Authorization:
"Bearer "+token
}

}
);


const data =
await res.json();


if(data.success){

btn.nextElementSibling
.innerHTML =
data.dislikes;


const action =
btn.closest(".actions");

const buttons =
action.querySelectorAll(
".action"
);


if(buttons[0]){

buttons[0]
.querySelector("span")
.innerHTML =
data.likes;

}

}

}


/* =========================
   Subscribe
========================= */

async function subscribe(id,btn){

const token =
localStorage.token;


if(!token){

alert("Login required");

return;

}


const res =
await fetch(
"/channels/subscribe/"+id,
{

method:"POST",

headers:{
Authorization:
"Bearer "+token
}

}
);


const data =
await res.json();


if(data.success){

btn.nextElementSibling
.innerHTML =
data.subscribers;

}

}


/* =========================
   Open Channel
========================= */

function openChannel(id){

location.href =
"channel.html?id="+id;

}


/* =========================
   Copy Link
========================= */

function openComments(id) {
    if (id === undefined || id === null || id === "") {
        alert("Could not identify this Short.");
        return;
    }

    location.href =
        "comments.html?videoId=" +
        encodeURIComponent(id) +
        "&source=shorts";
}

async function copyVideoLink(id){

    const link =
        window.location.origin +
        "/watch.html?id=" +
        encodeURIComponent(id);

    try{

        await navigator.clipboard.writeText(link);

        alert("Video link copied!");

    }catch(error){

        const textarea =
            document.createElement("textarea");

        textarea.value = link;
        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";

        document.body.appendChild(textarea);

        textarea.focus();
        textarea.select();

        try{

            document.execCommand("copy");

            alert("Video link copied!");

        }catch(copyError){

            console.error(
                "Copy failed:",
                copyError
            );

            alert(
                "Could not copy the video link."
            );

        }finally{

            document.body.removeChild(textarea);

        }

    }


}


/* =========================
   Escape HTML
========================= */

function escapeHTML(text){

return String(text)

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


/* =========================
   Start
========================= */

loadShorts();

</script>

</body></html>
